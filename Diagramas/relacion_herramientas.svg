<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5a7fa8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7060a8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c07a2e"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a8c6f"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05a20"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0000001a"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="720" fill="#f4f7fa"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1000" height="52" fill="#1e3a5f"/>
  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="white" letter-spacing="0.5">RELACIÓN ENTRE HERRAMIENTAS DEL SISTEMA</text>

  <!-- ===========================
       ROW 1: Ansible (top center)
       =========================== -->
  <g filter="url(#shadow)">
    <rect x="370" y="72" width="260" height="88" rx="10" fill="#f0edf8" stroke="#7060a8" stroke-width="2"/>
  </g>
  <rect x="370" y="72" width="260" height="28" rx="10" fill="#7060a8"/>
  <rect x="370" y="93" width="260" height="7" fill="#7060a8"/>
  <text x="500" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Ansible</text>
  <text x="500" y="116" text-anchor="middle" font-size="11" fill="#3a2870" font-weight="600">Automatización</text>
  <text x="500" y="132" text-anchor="middle" font-size="10" fill="#5a4080">Provisiona y configura los entornos</text>
  <text x="500" y="148" text-anchor="middle" font-size="10" fill="#5a4080">mediante playbooks</text>

  <!-- ===========================
       ROW 2: AWS EC2 (left) | Lubuntu (right)
       =========================== -->
  <!-- AWS EC2 -->
  <g filter="url(#shadow)">
    <rect x="60" y="210" width="240" height="90" rx="10" fill="#fff3e0" stroke="#d08030" stroke-width="1.8"/>
  </g>
  <rect x="60" y="210" width="240" height="28" rx="10" fill="#d08030"/>
  <rect x="60" y="231" width="240" height="7" fill="#d08030"/>
  <text x="180" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="white">AWS EC2</text>
  <text x="180" y="254" text-anchor="middle" font-size="11" fill="#3a2000" font-weight="600">Entorno Cloud</text>
  <text x="180" y="270" text-anchor="middle" font-size="10" fill="#6a4010">Infraestructura virtual en la nube</text>
  <text x="180" y="285" text-anchor="middle" font-size="10" fill="#6a4010">Instancia Linux sobre AWS</text>

  <!-- Lubuntu -->
  <g filter="url(#shadow)">
    <rect x="700" y="210" width="240" height="90" rx="10" fill="#e8f0fa" stroke="#3a6a90" stroke-width="1.8"/>
  </g>
  <rect x="700" y="210" width="240" height="28" rx="10" fill="#3a6a90"/>
  <rect x="700" y="231" width="240" height="7" fill="#3a6a90"/>
  <text x="820" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Lubuntu</text>
  <text x="820" y="254" text-anchor="middle" font-size="11" fill="#1a3a5a" font-weight="600">Entorno Local</text>
  <text x="820" y="270" text-anchor="middle" font-size="10" fill="#3a5a80">Servidor físico o virtual local</text>
  <text x="820" y="285" text-anchor="middle" font-size="10" fill="#3a5a80">Sistema operativo Linux ligero</text>

  <!-- ===========================
       ROW 3: Docker / Docker Compose (center)
       =========================== -->
  <g filter="url(#shadow)">
    <rect x="370" y="360" width="260" height="90" rx="10" fill="#dfe9f3" stroke="#3a6ea0" stroke-width="2"/>
  </g>
  <rect x="370" y="360" width="260" height="28" rx="10" fill="#3a6ea0"/>
  <rect x="370" y="381" width="260" height="7" fill="#3a6ea0"/>
  <text x="500" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Docker / Docker Compose</text>
  <text x="500" y="402" text-anchor="middle" font-size="11" fill="#1a3a5a" font-weight="600">Contenedores de servicios</text>
  <text x="500" y="418" text-anchor="middle" font-size="10" fill="#3a5a80">Ejecución aislada de cada herramienta</text>
  <text x="500" y="434" text-anchor="middle" font-size="10" fill="#3a5a80">Orquestación con Docker Compose</text>

  <!-- ===========================
       ROW 4: Uptime Kuma | Node Exporter | Prometheus | Grafana
       =========================== -->
  <!-- Uptime Kuma -->
  <g filter="url(#shadow)">
    <rect x="28" y="520" width="196" height="112" rx="10" fill="white" stroke="#4a8ec4" stroke-width="1.8"/>
  </g>
  <rect x="28" y="520" width="196" height="26" rx="10" fill="#4a8ec4"/>
  <rect x="28" y="538" width="196" height="8" fill="#4a8ec4"/>
  <text x="126" y="537" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Uptime Kuma</text>
  <text x="126" y="560" text-anchor="middle" font-size="11" fill="#1a3a5a" font-weight="600">Disponibilidad</text>
  <text x="126" y="576" text-anchor="middle" font-size="10" fill="#3a5a80">Monitoriza servicios,</text>
  <text x="126" y="590" text-anchor="middle" font-size="10" fill="#3a5a80">puertos y nodos</text>
  <text x="126" y="606" text-anchor="middle" font-size="10" fill="#607090">HTTP, TCP, ping</text>
  <text x="126" y="620" text-anchor="middle" font-size="10" fill="#607090">Estado y alertas</text>

  <!-- Node Exporter -->
  <g filter="url(#shadow)">
    <rect x="248" y="520" width="196" height="112" rx="10" fill="white" stroke="#5a9a70" stroke-width="1.8"/>
  </g>
  <rect x="248" y="520" width="196" height="26" rx="10" fill="#5a9a70"/>
  <rect x="248" y="538" width="196" height="8" fill="#5a9a70"/>
  <text x="346" y="537" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Node Exporter</text>
  <text x="346" y="560" text-anchor="middle" font-size="11" fill="#1a3a20" font-weight="600">Métricas del sistema</text>
  <text x="346" y="576" text-anchor="middle" font-size="10" fill="#2a5a30">Recolecta métricas del</text>
  <text x="346" y="590" text-anchor="middle" font-size="10" fill="#2a5a30">sistema operativo</text>
  <text x="346" y="606" text-anchor="middle" font-size="10" fill="#4a7050">CPU · RAM · Disco</text>
  <text x="346" y="620" text-anchor="middle" font-size="10" fill="#4a7050">Red · Uptime</text>

  <!-- Prometheus -->
  <g filter="url(#shadow)">
    <rect x="468" y="520" width="196" height="112" rx="10" fill="white" stroke="#c07a2e" stroke-width="1.8"/>
  </g>
  <rect x="468" y="520" width="196" height="26" rx="10" fill="#c07a2e"/>
  <rect x="468" y="538" width="196" height="8" fill="#c07a2e"/>
  <text x="566" y="537" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Prometheus</text>
  <text x="566" y="560" text-anchor="middle" font-size="11" fill="#3a2000" font-weight="600">Recolección de métricas</text>
  <text x="566" y="576" text-anchor="middle" font-size="10" fill="#5a3010">Almacena métricas en</text>
  <text x="566" y="590" text-anchor="middle" font-size="10" fill="#5a3010">series de tiempo</text>
  <text x="566" y="606" text-anchor="middle" font-size="10" fill="#7a5030">Scraping de exportadores</text>
  <text x="566" y="620" text-anchor="middle" font-size="10" fill="#7a5030">Puerto 9090 · PromQL</text>

  <!-- Grafana -->
  <g filter="url(#shadow)">
    <rect x="688" y="520" width="196" height="112" rx="10" fill="white" stroke="#e05a20" stroke-width="1.8"/>
  </g>
  <rect x="688" y="520" width="196" height="26" rx="10" fill="#e05a20"/>
  <rect x="688" y="538" width="196" height="8" fill="#e05a20"/>
  <text x="786" y="537" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Grafana</text>
  <text x="786" y="560" text-anchor="middle" font-size="11" fill="#3a1a00" font-weight="600">Visualización</text>
  <text x="786" y="576" text-anchor="middle" font-size="10" fill="#5a2a00">Dashboards interactivos</text>
  <text x="786" y="590" text-anchor="middle" font-size="10" fill="#5a2a00">para métricas del sistema</text>
  <text x="786" y="606" text-anchor="middle" font-size="10" fill="#7a4010">Fuente: Prometheus</text>
  <text x="786" y="620" text-anchor="middle" font-size="10" fill="#7a4010">Puerto 3000</text>

  <!-- Note below Grafana -->
  <g filter="url(#shadow)">
    <rect x="888" y="520" width="96" height="112" rx="10" fill="#f0f4f8" stroke="#8090a8" stroke-width="1"/>
  </g>
  <text x="936" y="545" text-anchor="middle" font-size="9.5" fill="#3a5070" font-weight="600">Acceso</text>
  <text x="936" y="558" text-anchor="middle" font-size="9.5" fill="#3a5070">administrador</text>
  <line x1="905" y1="565" x2="968" y2="565" stroke="#c0d0e0" stroke-width="0.8"/>
  <text x="936" y="580" text-anchor="middle" font-size="9" fill="#5a7090">Kuma :3001</text>
  <text x="936" y="592" text-anchor="middle" font-size="9" fill="#5a7090">Grafana :3000</text>
  <text x="936" y="604" text-anchor="middle" font-size="9" fill="#5a7090">(vía navegador</text>
  <text x="936" y="616" text-anchor="middle" font-size="9" fill="#5a7090">web)</text>

  <!-- ========================
       ARROWS
       ======================== -->

  <!-- Ansible → AWS EC2 -->
  <line x1="420" y1="160" x2="280" y2="210" stroke="#7060a8" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
  <text x="320" y="182" text-anchor="middle" font-size="9.5" fill="#7060a8">aprovisiona</text>

  <!-- Ansible → Lubuntu -->
  <line x1="580" y1="160" x2="720" y2="210" stroke="#7060a8" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
  <text x="680" y="182" text-anchor="middle" font-size="9.5" fill="#7060a8">aprovisiona</text>

  <!-- AWS EC2 → Docker -->
  <line x1="240" y1="300" x2="390" y2="362" stroke="#d08030" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <text x="290" y="330" text-anchor="middle" font-size="9.5" fill="#d08030">ejecuta</text>

  <!-- Lubuntu → Docker -->
  <line x1="760" y1="300" x2="610" y2="362" stroke="#3a6a90" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="710" y="330" text-anchor="middle" font-size="9.5" fill="#3a6a90">ejecuta</text>

  <!-- Docker → Uptime Kuma -->
  <line x1="410" y1="450" x2="188" y2="520" stroke="#3a6ea0" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Docker → Node Exporter -->
  <line x1="440" y1="450" x2="370" y2="520" stroke="#3a6ea0" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Docker → Prometheus -->
  <line x1="560" y1="450" x2="566" y2="520" stroke="#3a6ea0" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Docker → Grafana -->
  <line x1="590" y1="450" x2="748" y2="520" stroke="#3a6ea0" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Node Exporter → Prometheus -->
  <line x1="444" y1="580" x2="468" y2="580" stroke="#5a9a70" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <text x="456" y="572" text-anchor="middle" font-size="8.5" fill="#4a8c6f">expone</text>

  <!-- Prometheus → Grafana -->
  <line x1="664" y1="580" x2="688" y2="580" stroke="#c07a2e" stroke-width="1.4" marker-end="url(#arrow-orange)"/>
  <text x="676" y="572" text-anchor="middle" font-size="8.5" fill="#c07a2e">fuente</text>

  <!-- ========================
       LEGEND
       ======================== -->
  <rect x="28" y="660" width="464" height="46" rx="6" fill="#eef3f8" stroke="#b0c0d8" stroke-width="1"/>
  <text x="38" y="676" font-size="10" font-weight="bold" fill="#1e3a5f">LEYENDA:</text>
  <line x1="98" y1="672" x2="120" y2="672" stroke="#7060a8" stroke-width="2"/>
  <text x="125" y="675" font-size="9.5" fill="#3a2870">Aprovisiona (Ansible)</text>
  <line x1="230" y1="672" x2="252" y2="672" stroke="#d08030" stroke-width="2"/>
  <text x="257" y="675" font-size="9.5" fill="#6a4010">Ejecuta en</text>
  <line x1="310" y1="672" x2="332" y2="672" stroke="#3a6ea0" stroke-width="2"/>
  <text x="337" y="675" font-size="9.5" fill="#1a3a5a">Despliega contenedor</text>
  <line x1="98" y1="692" x2="120" y2="692" stroke="#5a9a70" stroke-width="2"/>
  <text x="125" y="695" font-size="9.5" fill="#2a5a30">Expone métricas</text>
  <line x1="220" y1="692" x2="242" y2="692" stroke="#c07a2e" stroke-width="2"/>
  <text x="247" y="695" font-size="9.5" fill="#5a3010">Fuente de datos (Prometheus → Grafana)</text>

  <!-- Footer -->
  <rect x="0" y="706" width="1000" height="14" fill="#1e3a5f"/>
  <text x="500" y="717" text-anchor="middle" font-size="9" fill="#90aaca">Proyecto: Monitorización de Red — Diagrama de Relación entre Herramientas</text>
</svg>
