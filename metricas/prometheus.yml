global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "gastosmart_frontend"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://100.56.250.109/"
        labels:
          layer: "frontend"
          service: "GastoSmart Frontend"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "gastosmart_backend_health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://100.56.250.109/api/health"
        labels:
          layer: "backend"
          service: "GastoSmart Backend Health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "gastosmart_db_health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://100.56.250.109/api/db-health"
        labels:
          layer: "database"
          service: "GastoSmart MongoDB indirecto"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "gastosmart-nodes"
    metrics_path: "/node-frontend/metrics"
    static_configs:
      - targets:
          - "100.56.250.109"
        labels:
          instance: "frontend"

  - job_name: "gastosmart-backend"
    metrics_path: "/node-backend/metrics"
    static_configs:
      - targets:
          - "100.56.250.109"
        labels:
          instance: "backend"

  - job_name: "gastosmart-mongodb"
    metrics_path: "/node-mongodb/metrics"
    static_configs:
      - targets:
          - "100.56.250.109"
        labels:
          instance: "mongodb"

  - job_name: "uptime-kuma"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "32.196.107.176:3001"
