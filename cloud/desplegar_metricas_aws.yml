---
- name: Desplegar modulo de metricas en instancia EC2 AWS
  hosts: aws:monitorizacion
  gather_facts: no

  vars_files:
    - variables_aws.yml

  tasks:
    - name: Crear directorio local para secretos
      delegate_to: localhost
      become: no
      file:
        path: "{{ playbook_dir }}/../{{ grafana_password_file | dirname }}"
        state: directory
        mode: '0700'

    - name: Esperar conexion SSH con la instancia
      wait_for_connection:
        timeout: 300
        delay: 10

    - name: Recolectar informacion del sistema
      setup:

    - name: Actualizar cache de paquetes
      become: yes
      apt:
        update_cache: yes

    - name: Instalar Docker y Docker Compose
      become: yes
      apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Iniciar y habilitar Docker
      become: yes
      service:
        name: docker
        state: started
        enabled: yes

    - name: Crear directorio para modulo de metricas
      become: yes
      file:
        path: /opt/metricas
        state: directory
        mode: '0755'

    - name: Copiar archivo docker-compose-metricas.yml
      become: yes
      copy:
        src: ../metricas/docker-compose-metricas.yml
        dest: /opt/metricas/docker-compose-metricas.yml
        mode: '0644'

    - name: Copiar archivo prometheus.yml
      become: yes
      copy:
        src: ../metricas/prometheus.yml
        dest: /opt/metricas/prometheus.yml
        mode: '0644'

    - name: Crear archivo de entorno seguro para Grafana
      become: yes
      copy:
        dest: /opt/metricas/.env
        mode: '0600'
        content: |
          GF_SECURITY_ADMIN_USER={{ grafana_admin_user }}
          GF_SECURITY_ADMIN_PASSWORD={{ lookup('password', playbook_dir + '/../' + grafana_password_file + ' length=24 chars=ascii_letters,digits') }}
      no_log: true

    - name: Eliminar contenedores anteriores de metricas conservando volumenes
      become: yes
      shell: |
        docker rm -f prometheus node-exporter grafana >/dev/null 2>&1 || true
        docker ps -aq --filter "label=com.docker.compose.project=metricas" | xargs -r docker rm -f
      register: contenedores_metricas_eliminados
      changed_when: contenedores_metricas_eliminados.stdout | length > 0

    - name: Levantar contenedores de metricas
      become: yes
      command: docker-compose -f docker-compose-metricas.yml up -d
      args:
        chdir: /opt/metricas

    - name: Esperar a que Grafana este listo
      become: yes
      command: docker exec grafana grafana cli admin --help
      register: grafana_ready
      retries: 12
      delay: 5
      until: grafana_ready.rc == 0
      changed_when: false

    - name: Verificar contenedores activos
      become: yes
      command: docker ps
      register: contenedores
      changed_when: false

    - name: Mostrar contenedores activos
      debug:
        var: contenedores.stdout_lines
