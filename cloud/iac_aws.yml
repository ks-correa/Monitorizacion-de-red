---
- name: Crear infraestructura AWS para Monitorizacion de Red
  hosts: localhost
  connection: local
  gather_facts: no

  vars_files:
    - variables_aws.yml

  tasks:
    - name: Detectar IP publica del administrador
      uri:
        url: https://checkip.amazonaws.com
        return_content: yes
      register: detected_admin_public_ip
      changed_when: false
      when: admin_public_cidr == "auto"

    - name: Definir CIDR administrativo efectivo
      set_fact:
        effective_admin_cidr: >-
          {{
            (detected_admin_public_ip.content | trim ~ '/32')
            if admin_public_cidr == 'auto'
            else admin_public_cidr
          }}

    - name: Mostrar CIDR permitido para administracion
      debug:
        msg: "Los puertos administrativos se limitaran a {{ effective_admin_cidr }}"

    - name: Obtener AMI Ubuntu 22.04 mas reciente
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: "099720109477"
        filters:
          name: "ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*"
          architecture: "x86_64"
          virtualization-type: "hvm"
          root-device-type: "ebs"
      register: ubuntu_amis

    - name: Seleccionar AMI mas reciente
      set_fact:
        ubuntu_ami: "{{ ubuntu_amis.images | sort(attribute='creation_date') | last }}"

    - name: Mostrar AMI seleccionada
      debug:
        msg: "AMI seleccionada: {{ ubuntu_ami.image_id }}"

    - name: Crear Security Group para SSH, Uptime Kuma y Grafana
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        description: "Security Group para proyecto de monitorizacion de red"
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        state: present
        purge_rules: true
        purge_rules_egress: true
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ allowed_ssh_cidr }}"
            rule_desc: Permitir SSH para Ansible

          - proto: tcp
            from_port: 3001
            to_port: 3001
            cidr_ip: "{{ allowed_web_cidr }}"
            rule_desc: Permitir acceso web a Uptime Kuma

          - proto: tcp
            from_port: 3000
            to_port: 3000
            cidr_ip: "{{ allowed_grafana_cidr }}"
            rule_desc: Permitir acceso web a Grafana
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
      register: sg_monitorizacion

    - name: Mostrar Security Group creado o actualizado
      debug:
        msg: "Security Group utilizado: {{ sg_monitorizacion.group_id }}"

    - name: Crear instancia EC2 para Uptime Kuma
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ubuntu_ami.image_id }}"
        region: "{{ aws_region }}"
        security_group: "{{ sg_monitorizacion.group_id }}"
        wait: yes
        network:
          assign_public_ip: true
        tags:
          Proyecto: MonitorizacionRed
          Servicio: UptimeKuma
          CreadoPor: Ansible
      register: ec2

    - name: Mostrar informacion de la instancia creada
      debug:
        var: ec2.instances

    - name: Esperar puerto SSH antes de registrar huella
      wait_for:
        host: "{{ ec2.instances[0].public_ip_address }}"
        port: 22
        timeout: 300
        state: started
      delegate_to: localhost

    - name: Crear directorio local para known_hosts
      file:
        path: "{{ known_hosts_file | dirname }}"
        state: directory
        mode: '0700'
      delegate_to: localhost

    - name: Registrar huella SSH de la instancia
      known_hosts:
        name: "{{ ec2.instances[0].public_ip_address }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' ~ ec2.instances[0].public_ip_address) }}"
        path: "{{ known_hosts_file }}"
        state: present
      delegate_to: localhost

    - name: Crear inventory.ini con IP publica
      copy:
        dest: ../inventory.ini
        content: |
          [aws]
          {{ ec2.instances[0].public_ip_address }} ansible_user=ubuntu ansible_ssh_private_key_file={{ key_file }}

    - name: Mostrar IP publica de la instancia
      debug:
        msg: "Instancia creada correctamente. IP publica: {{ ec2.instances[0].public_ip_address }}"
