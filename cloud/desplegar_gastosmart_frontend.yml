---
- name: Construir frontend de GastoSmart localmente
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Construir frontend local usando Docker Node
      command: >
        docker run --rm
        -v {{ playbook_dir }}/../apps/gastosmart:/workspace
        -w /workspace/frontend
        -e VITE_API_BASE_URL=/api
        node:20-alpine
        sh -c "npm install && npm run build"

    - name: Crear paquete del frontend compilado
      archive:
        path: "{{ playbook_dir }}/../apps/gastosmart/dist/"
        dest: /tmp/gastosmart-frontend-dist.tar.gz
        format: gz

- name: Desplegar frontend publico de GastoSmart con Nginx
  hosts: frontend
  become: yes
  gather_facts: no

  vars_files:
    - variables_gastosmart.yml

  tasks:
    - name: Esperar conexion SSH
      wait_for_connection:
        timeout: 300
        delay: 10

    - name: Recolectar informacion del sistema
      setup:

    - name: Definir IP privada del backend
      set_fact:
        backend_private_host: "{{ backend_private_ip | default(hostvars['backend'].ansible_host) }}"

    - name: Actualizar cache de paquetes
      apt:
        update_cache: yes

    - name: Instalar Docker
      apt:
        name:
          - docker.io
        state: present

    - name: Iniciar y habilitar Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Crear estructura del frontend
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/gastosmart-frontend
        - /opt/gastosmart-frontend/html
        - /opt/gastosmart-frontend/nginx

    - name: Copiar paquete del frontend compilado
      copy:
        src: /tmp/gastosmart-frontend-dist.tar.gz
        dest: /opt/gastosmart-frontend/gastosmart-frontend-dist.tar.gz
        mode: '0644'

    - name: Limpiar frontend anterior
      file:
        path: /opt/gastosmart-frontend/html
        state: absent

    - name: Recrear directorio html
      file:
        path: /opt/gastosmart-frontend/html
        state: directory
        mode: '0755'

    - name: Descomprimir frontend compilado
      unarchive:
        src: /opt/gastosmart-frontend/gastosmart-frontend-dist.tar.gz
        dest: /opt/gastosmart-frontend/html
        remote_src: yes

    - name: Renderizar Nginx con backend privado
      copy:
        dest: /opt/gastosmart-frontend/nginx/default.conf
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              location / {
                  try_files $uri /index.html;
              }

              location /api/ {
                  proxy_pass http://{{ backend_private_host }}:8000/api/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Eliminar contenedor anterior si existe
      command: docker rm -f gastosmart-frontend
      register: remove_frontend
      failed_when: false
      changed_when: remove_frontend.rc == 0

    - name: Levantar frontend con Nginx
      command: >
        docker run -d
        --name gastosmart-frontend
        --restart unless-stopped
        -p 80:80
        -v /opt/gastosmart-frontend/html:/usr/share/nginx/html:ro
        -v /opt/gastosmart-frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        nginx:1.27-alpine

    - name: Validar frontend local
      command: curl -fsS http://localhost
      register: frontend_health
      retries: 10
      delay: 5
      until: frontend_health.rc == 0
      changed_when: false

    - name: Validar backend via proxy
      command: curl -fsS http://localhost/api/health
      register: proxy_backend_health
      retries: 10
      delay: 5
      until: proxy_backend_health.rc == 0
      changed_when: false

    - name: Validar DB health via proxy
      command: curl -fsS http://localhost/api/db-health
      register: proxy_db_health
      retries: 10
      delay: 5
      until: proxy_db_health.rc == 0
      changed_when: false

    - name: Mostrar URLs del frontend
      debug:
        msg:
          - "Frontend local en instancia: http://localhost"
          - "Proxy backend: {{ proxy_backend_health.stdout }}"
          - "Proxy DB: {{ proxy_db_health.stdout }}"
