---
aws_region: us-east-1

instance_type: t3.small
key_name: monitorizacion-key
key_file: ./monitorizacion-key.pem
known_hosts_file: ~/.ssh/known_hosts

security_group_name: monitorizacion-red-sg
instance_name: monitorizacion-red-uptime-kuma

vpc_id: vpc-055c82200f460c027

grafana_admin_user: admin
grafana_password_file: .secrets/grafana_admin_password

# IP privada del equipo administrador dentro de la red local.
# No sirve para limitar AWS directamente, porque AWS ve la IP publica de salida a Internet.
local_pc_ip: 192.168.0.10

# Usar "auto" para detectar la IP publica actual del administrador y convertirla en /32.
# Tambien se puede fijar manualmente, por ejemplo: 181.50.10.20/32
admin_public_cidr: auto

# Durante la configuracion inicial se puede usar 0.0.0.0/0 temporalmente.
# En estado seguro, estos puertos quedan limitados al CIDR administrativo.
allowed_ssh_cidr: "{{ effective_admin_cidr }}"
allowed_web_cidr: "{{ effective_admin_cidr }}"
allowed_grafana_cidr: "{{ effective_admin_cidr }}"
