services:
  gastosmart-frontend:
    build:
      context: ../..
      dockerfile: apps/gastosmart/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        NGINX_CONF: apps/gastosmart/frontend/nginx.local.conf
    container_name: gastosmart-frontend
    depends_on:
      gastosmart-backend:
        condition: service_started
    ports:
      - "8080:80"
    networks:
      - gastosmart-net
    restart: unless-stopped

  gastosmart-backend:
    build:
      context: ../..
      dockerfile: apps/gastosmart/backend/Dockerfile
    container_name: gastosmart-backend
    environment:
      MONGODB_URL: mongodb://gastosmart-mongodb:27017/gastosmart
      DATABASE_NAME: gastosmart
      MONGODB_TIMEOUT_MS: "3000"
      EMAIL_DELIVERY_MODE: console
    depends_on:
      gastosmart-mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - gastosmart-net
    restart: unless-stopped

  gastosmart-mongodb:
    image: mongo:7
    container_name: gastosmart-mongodb
    command: ["mongod", "--config", "/etc/mongod.conf"]
    volumes:
      - gastosmart-mongodb-data:/data/db
      - ./mongodb/mongod.conf:/etc/mongod.conf:ro
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - gastosmart-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  gastosmart-net:
    name: gastosmart-net
    driver: bridge

volumes:
  gastosmart-mongodb-data:
    name: gastosmart-mongodb-volume
